- type: tf
  topic: /tf
  folder: transforms
  args:
    base_frame: odom
    target_frames:
      - LF_FOOT
      - RF_FOOT
      - LH_FOOT
      - RH_FOOT
      - base
    euler: true
    sample_rate: 100.0

- type: tf
  topic: /tf
  folder: transforms_static
  args:
    base_frame: base
    target_frames:
      - wide_angle_camera_front_camera
    euler: true
    sample_rate: 1.0

- type: anymal_state
  topic: /legged_odometry/anymal_state
  folder: state

- type: anymal_actuators
  topic: /anymal_low_level_controller/actuator_readings
  folder: actuators

- type: imu
  topic: /sensors/imu
  folder: imu

- type: theodolite
  topic: /theodolite_data
  folder: theodolite

- type: image
  topic: /wide_angle_camera_front/image_color_throttle
  folder: camera_front
  args:
    extension: png
    rectify: true
    video: true