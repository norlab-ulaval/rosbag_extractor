- type: tf
  topic: /tf
  folder: transforms
  args:
    base_frame: odom
    target_frames:
      - LF_FOOT
      - RF_FOOT
      - LH_FOOT
      - RH_FOOT
      - base
    euler: true
    sample_rate: 100.0

- type: anymal_state
  topic: /legged_odometry/anymal_state
  folder: state

- type: anymal_actuators
  topic: /anymal_low_level_controller/actuator_readings
  folder: actuators

- type: imu
  topic: /sensors/imu
  folder: imu
