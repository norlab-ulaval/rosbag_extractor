name: Auto-merge main into feature branches

on:
  push:
    branches:
      - main

jobs:
  merge-main:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [anymal, backpack, mtt]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into ${{ matrix.branch }}
        run: |
          git config user.email "bot@github.com"
          git config user.name "GitHub Actions"
          git checkout ${{ matrix.branch }}
          if ! git merge origin/main --no-edit; then
            if [ "${{ matrix.branch }}" = "backpack" ]; then
              unresolved_files="$(git diff --name-only --diff-filter=U)"
              if [ "$unresolved_files" = "src/types/image.py" ]; then
                git checkout --ours src/types/image.py
                git add src/types/image.py
                git commit --no-edit
              else
                echo "Unexpected merge conflicts on backpack branch:"
                echo "$unresolved_files"
                exit 1
              fi
            else
              exit 1
            fi
          fi
          git push origin ${{ matrix.branch }}